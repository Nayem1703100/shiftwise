}
function syncExplain() {
  if (Store.mode === 'fb') return `<b class="pos">Live sync is on.</b> Every phone using this app shares the same stock list in real time. Changes made offline (walk-in freezers, basements) are saved on the phone and upload when signal returns.`;
  return `<b class="warn">Stock is only saved on this device.</b> Other staff won't see your updates until live sync is set up. A manager can turn it on by adding a free Firebase project to <span class="mono">stock.html</span>; the steps are in README.md.${Store.status === 'error' ? '<br><b class="neg">Live sync is configured but failed to connect. Check the browser console.</b>' : ''}`;
}
function openSyncInfo() { openSheet('static', `<div class="sheet-head"><h2>Sync</h2><button class="x" onclick="closeSheet()">✕</button></div><div style="font-size:.85rem;color:var(--text2);line-height:1.6">${syncExplain()}</div>`); }
function saveSettings() {
  const cur = settings();
  const pin = $('s-pin').value.trim();
  if (pin && !/^\d{4,8}$/.test(pin)) { toast('PIN must be 4–8 digits'); return; }
  Store.put('meta', Object.assign({}, cur, { id: 'settings', name: $('s-name').value.trim() || cur.name, currency: $('s-cur').value.trim() || '£', pin: pin || cur.pin }));
  toast('Settings saved');
}
function editSupplier(name) {
  const c = ((settings().suppliers || {})[name]) || {};
  openSheet('static', `
    <div class="sheet-head"><h2>${name ? esc(name) : 'New supplier'}</h2><button class="x" onclick="closeSheet()">✕</button></div>
    <div class="form-grid">
      <div class="field full"><label>Name</label><input class="input" id="sp-name" value="${esc(name)}" ${name ? 'disabled' : ''}></div>
      <div class="field"><label>WhatsApp / phone</label><input class="input" id="sp-phone" type="tel" value="${esc(c.phone || '')}" placeholder="+44 7…"></div>
      <div class="field"><label>Email</label><input class="input" id="sp-email" type="email" value="${esc(c.email || '')}"></div>
      <div class="field full"><label>Order days / notes</label><input class="input" id="sp-notes" value="${esc(c.notes || '')}" placeholder="e.g. order by 2pm for next-day delivery"></div>
    </div>
    <div class="btn-row"><button class="btn btn-primary" onclick="saveSupplier()">Save</button></div>`);
}
function saveSupplier() {
  const n = $('sp-name').value.trim(); if (!n) return;
  const s = settings();
  const suppliers = Object.assign({}, s.suppliers || {});
  suppliers[n] = { phone: $('sp-phone').value.trim(), email: $('sp-email').value.trim(), notes: $('sp-notes').value.trim() };
  Store.put('meta', Object.assign({}, s, { id: 'settings', suppliers }));
  closeSheet(); toast('Supplier saved');
}
function exportStockCsv() {
  const rows = [['Name', 'Category', 'Unit', 'Qty', 'Par', 'Order up to', 'Unit price', 'Value', 'Supplier', 'Location', 'Expiry', 'Last received', 'Last counted', 'Last updated', 'Updated by', 'SKU']];
  items().sort((a, b) => a.name.localeCompare(b.name)).forEach(i => rows.push([i.name, i.category, i.unit, r3(i.qty), i.par, i.target, i.cost, r3(itemValue(i)), i.supplier, i.location, i.expiry,
    i.lastReceived ? todayIso(new Date(i.lastReceived)) : '', i.lastCounted ? todayIso(new Date(i.lastCounted)) : '', i.updatedAt ? new Date(i.updatedAt).toLocaleString('en-GB') : '', i.updatedBy, i.sku]));
  download('stock-' + todayStr() + '.csv', csv(rows), 'text/csv');
}
function exportBackup() { download('stockwise-backup-' + todayStr() + '.json', JSON.stringify({ app: 'stockwise', v: 1, at: Date.now(), db: Store.db }, null, 1), 'application/json'); }
function importBackup(file) {
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const data = JSON.parse(r.result);
      if (!data.db || !data.db.items) throw new Error('Not a StockWise backup');
      if (!confirm(`Restore ${Object.keys(data.db.items).length} items and their history? Existing records with the same IDs are replaced.`)) return;
      Store.batch(() => COLS.forEach(col => Object.values(data.db[col] || {}).forEach(d => d && d.id && Store.put(col, d))));
      toast('Backup restored');
    } catch (e) { toast('Restore failed: ' + e.message); }
  };
  r.readAsText(file);
}
function wipeAll() {
  if (!confirm('Delete ALL items, orders, checks and history? This cannot be undone.')) return;
  if (prompt('Type DELETE to confirm') !== 'DELETE') return;
  Store.batch(() => ['items', 'orders', 'checks', 'movements'].forEach(col => Object.keys(Store.db[col]).forEach(id => Store.remove(col, id))));
  toast('All data deleted');
}
function loadSampleShared() {
  if (!needMgr(loadSampleShared)) return;
  const d = emptyDb(); loadSample(d);
  Store.batch(() => COLS.forEach(col => Object.values(d[col]).forEach(doc => { if (col === 'meta' && Store.db.meta.settings) return; Store.put(col, doc); })));
  toast('Sample items loaded');
}
