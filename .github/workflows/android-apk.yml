name: Android APK

on:
  push:
    branches: [main, 'claude/**']
    paths-ignore: ['**.md']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        run: |
          npm run build:web
          npx cap add android
          npx capacitor-assets generate --android \
            --iconBackgroundColor '#0e0f11' --iconBackgroundColorDark '#0e0f11' \
            --splashBackgroundColor '#0e0f11' --splashBackgroundColorDark '#0e0f11'
          npx cap sync android

      - name: Set version
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      # A fixed key, so each new APK installs over the old one without
      # uninstalling (which would wipe stock saved on the phone).
      - name: Use repository signing key
        run: |
          mkdir -p ~/.android
          cp keystore/sideload-debug.keystore ~/.android/debug.keystore

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk StockWise-1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: StockWise-APK
          path: StockWise-*.apk
          retention-days: 30
