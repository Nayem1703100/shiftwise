name: Android APK

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
    paths-ignore: ['**.md', 'play-store/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        run: |
          npm run build:web
          npx cap add android
          npx capacitor-assets generate --android \
            --iconBackgroundColor '#0e0f11' --iconBackgroundColorDark '#0e0f11' \
            --splashBackgroundColor '#0e0f11' --splashBackgroundColorDark '#0e0f11'
          npx cap sync android

      - name: Set version
        run: |
          sed -i "s/versionCode 1$/versionCode $VERSION_CODE/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"$VERSION_NAME\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      # Sideload build: a fixed public key so each APK installs over the last
      # one without uninstalling (which would wipe stock saved on the phone).
      - name: Build sideload APK
        run: |
          mkdir -p ~/.android
          cp keystore/sideload-debug.keystore ~/.android/debug.keystore
          cd android && ./gradlew assembleDebug --no-daemon

      # Play Store build: signed with the private upload key from repository
      # secrets. Without them, a throwaway key proves the build works, and the
      # output is labelled so it can't be mistaken for an upload.
      - name: Prepare release signing key
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/release.keystore"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$KS"
            echo "label=PlayStore" >> "$GITHUB_OUTPUT"
            {
              echo "STORE_PASS=$STORE_PASS"
              echo "KEY_ALIAS=$KEY_ALIAS"
              echo "KEY_PASS=${KEY_PASS:-$STORE_PASS}"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set. The AAB is signed with a throwaway test key and cannot be uploaded to Google Play."
            keytool -genkeypair -keystore "$KS" -storepass testpass -keypass testpass -alias test \
              -keyalg RSA -keysize 2048 -validity 365 -dname "CN=Test" 2>/dev/null
            echo "label=TEST-KEY-not-for-Play" >> "$GITHUB_OUTPUT"
            { echo "STORE_PASS=testpass"; echo "KEY_ALIAS=test"; echo "KEY_PASS=testpass"; } >> "$GITHUB_ENV"
          fi
          echo "KS=$KS" >> "$GITHUB_ENV"

      - name: Build release AAB and APK
        working-directory: android
        run: |
          ./gradlew bundleRelease assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$KS" \
            -Pandroid.injected.signing.store.password="$STORE_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"

      - name: Collect outputs
        run: |
          mkdir out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/StockWise-$VERSION_NAME-sideload.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "out/StockWise-$VERSION_NAME-${{ steps.key.outputs.label }}.aab"
          cp android/app/build/outputs/apk/release/app-release.apk "out/StockWise-$VERSION_NAME-${{ steps.key.outputs.label }}.apk"
          rm -f "$KS"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: StockWise-APK
          path: out/*.apk
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: StockWise-PlayStore-AAB
          path: out/*.aab
          retention-days: 30

      # The latest sideload APK, at a fixed link that downloads directly on a
      # phone: https://github.com/<owner>/<repo>/raw/apk/StockWise.apk
      # One force-pushed commit, so old APKs don't pile up in the repo.
      - name: Publish latest APK to the apk branch
        if: github.event_name != 'pull_request'
        env:
          TOKEN: ${{ github.token }}
        run: |
          mkdir pub
          cp out/*-sideload.apk pub/StockWise.apk
          cd pub
          printf '# StockWise APK\n\nVersion %s, built from %s (%s).\n\nDownload: [StockWise.apk](StockWise.apk)\n' "$VERSION_NAME" "${GITHUB_REF_NAME}" "${GITHUB_SHA::7}" > README.md
          git init -q -b apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -q -m "StockWise $VERSION_NAME"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" apk
